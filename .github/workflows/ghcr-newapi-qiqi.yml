name: Build isolated 89 Sonnet 5.5 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yizhixiaohaitun/newapi-qiqi
  PRODUCT_SHA: ad55f35fc88f6bd619810a94db225ad7a9be419b
  VERSION: newapi-qiqi-20261111-ad55f35

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact product revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
      - name: Verify product checkout and set version
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "Product revision: $(git rev-parse HEAD)"
          echo "$VERSION" > VERSION
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ env.PRODUCT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
