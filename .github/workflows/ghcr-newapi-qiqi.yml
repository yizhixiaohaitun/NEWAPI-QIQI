name: Isolated Xingai Claude signature recovery image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE_NAME: ghcr.io/yizhixiaohaitun/newapi-qiqi
  PRODUCT_SHA: 1972bfea7c69545a091d5f1630d27cef4096cc9e
jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out product commit
        uses: actions/checkout@v4
        with:
          ref: 1972bfea7c69545a091d5f1630d27cef4096cc9e
      - name: Resolve image version
        id: version
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          VERSION="newapi-qiqi-$(date -u +'%Y%m%d')-${PRODUCT_SHA:0:7}"
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.revision=${{ env.PRODUCT_SHA }}
