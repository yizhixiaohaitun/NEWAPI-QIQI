name: Build native first-byte fix image

on:
  push:
    branches:
      - fix/native-stream-first-byte-20261110

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yizhixiaohaitun/newapi-qiqi

jobs:
  build:
    name: Build and push isolated fix image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yizhixiaohaitun/newapi-qiqi:native-first-byte-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
