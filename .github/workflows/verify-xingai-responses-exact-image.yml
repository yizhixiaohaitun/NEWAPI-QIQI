name: Verify exact Xingai Responses release image (isolated)
on:
  push:
    branches: [verify/xingai-responses-0c190fb]
permissions:
  contents: read
  packages: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Immutable values from the successful site-specific build and byte-verified GHCR records.
    env:
      RELEASE_SHA: 0c190fbfe8788f9e054951740b165d3222fc419a
      RELEASE_TAG: newapi-qiqi-20261121-0c190fb
      RELEASE_RUN: '44898669104'
      REGISTRY_IMAGE: ghcr.io/yizhixiaohaitun/newapi-qiqi
      ROOT_DIGEST: sha256:9ab9e8fc1ffcf4ed82fc686e86a3ec3547477a52b136f4d0dd597ed9d9904081
      PLATFORM_DIGEST: sha256:5fa7cb24fd309814dce7ede740c2ca72012f5cb6a5b6c6f7092bd859e551e87f
      CONFIG_DIGEST: sha256:db666d01660c2fda0227f82bbd63c0a8d02c7622f6c71aecfd47ddccd99fa5b6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull by digest and match the exact site-specific release
        working-directory: ci-xingai-responses
        shell: bash
        run: |
          set -euxo pipefail
          image="$REGISTRY_IMAGE:$RELEASE_TAG@$ROOT_DIGEST"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          docker image inspect --format '{{json .RepoDigests}}' "$image" | jq -e --arg exact "$REGISTRY_IMAGE@$ROOT_DIGEST" 'index($exact) != null'
          # With the containerd store, Docker ID may be a manifest, not the OCI config.
          id=$(docker image inspect --format '{{.Id}}' "$image")
          [[ $id == "$ROOT_DIGEST" || $id == "$PLATFORM_DIGEST" || $id == "$CONFIG_DIGEST" ]]
          jq -n --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" --arg digest "$ROOT_DIGEST" --arg config_digest "$CONFIG_DIGEST" --arg docker_image_id "$id" --arg platform_manifest_digest "$PLATFORM_DIGEST" --argjson build_run "$RELEASE_RUN" '$ARGS.named' > isolated-image.json
          echo "XINGAI_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Exercise early and committed terminal errors with simulated upstream only
        working-directory: ci-xingai-responses
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          net="xingai-responses-${GITHUB_RUN_ID}"
          app="$net-gateway"
          docker network create --internal "$net"
          trap 'docker rm -fv "$app" >/dev/null 2>&1 || true; docker network rm "$net" >/dev/null 2>&1 || true' EXIT
          docker run --pull=never -d --name "$app" --network "$net" --network-alias gateway --tmpfs /data -e STREAMING_TIMEOUT=30 "$XINGAI_IMAGE"
          result=0
          docker run --rm --pull=never --network "$net" --network-alias fixture -v "$PWD:/verify" -w /verify python:3.12-alpine python3 -u isolated-responses.py 2>&1 | tee isolated-diagnostics.log || result=$?
          if (( result != 0 )); then docker logs --tail 70 "$app" >> isolated-diagnostics.log 2>&1; exit "$result"; fi
          rm isolated-diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-image-xingai-responses-0c190fb
          path: |
            ci-xingai-responses/isolated-*.json
            ci-xingai-responses/isolated-diagnostics.log
          retention-days: 14
          if-no-files-found: warn
